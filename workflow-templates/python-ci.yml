name: Python CI

on:
  push:
  pull_request:

jobs:
  quality:
    # PR and unreviewed refs require separate isolated self-hosted execution.
    runs-on:
      group: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'default' || 'jd-pr' }}
      labels: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'jd-ci' || 'jd-pr-isolated' }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --all-groups
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy .
      - run: uv run pytest

  container:
    # OCI builds run on trusted self-hosted jd-builder on main, and the
    # isolated self-hosted PR runner on unreviewed refs (Podman required).
    runs-on:
      group: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'default' || 'jd-pr' }}
      labels: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'jd-builder' || 'jd-pr-isolated' }}
    steps:
      - uses: actions/checkout@v5
      - run: |
          if [ -f Containerfile ]; then
            podman build -f Containerfile -t repository:ci .
          fi
