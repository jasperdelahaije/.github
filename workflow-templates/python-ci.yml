name: Python CI (self-hosted only)

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    # PR / non-main code must never execute on jd-ci or jd-builder.
    runs-on:
      group: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'default' || 'jd-pr' }}
      labels: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'jd-ci' || 'jd-pr-isolated' }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --all-groups
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy .
      - run: uv run pytest

  container:
    # Podman image builds may use the trusted builder only after reviewed main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: jd-builder
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v5
      - name: Build container locally if a Containerfile exists
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f Containerfile ]]; then
            podman build -f Containerfile -t repository:ci .
          fi
